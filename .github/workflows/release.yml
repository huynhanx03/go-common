name: release

on:
  push:
    branches: [release]

permissions:
  contents: read

# Keep an active release running. GitHub may combine rapid pushes into the latest pending run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    name: Verify release commit
    uses: ./.github/workflows/ci.yml

  publish:
    name: Publish Go module version
    needs: [verify]
    if: github.event_name == 'push' && github.ref == 'refs/heads/release'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - name: Install pinned release tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/release
      - name: Create next tag and GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/release/node_modules/semantic-release/bin/semantic-release.js --extends ./.github/release/release.config.mjs
