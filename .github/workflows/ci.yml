name: ci

on:
  pull_request:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  GOFLAGS: -mod=readonly

jobs:
  unit:
    name: Unit tests and coverage
    outputs:
      coverage: ${{ steps.report.outputs.total }}
      minimum_coverage: ${{ steps.report.outputs.minimum }}
      report: ${{ steps.report.outputs.report }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Test with coverage threshold
        id: coverage
        continue-on-error: true
        env:
          COVER_PROFILE: coverage.out
          COVERAGE_REPORT_FILE: ${{ runner.temp }}/unit-report.json
        run: ./scripts/verify-coverage.sh
      - name: Export unit report
        id: report
        if: always()
        run: |
          report_file="$RUNNER_TEMP/unit-report.json"
          if [[ -s "$report_file" ]] && jq -e 'type == "object"' "$report_file" > /dev/null; then
            report="$(jq -c . "$report_file")"
            total="$(jq -r '.coverage.total_percent // ""' "$report_file")"
            minimum="$(jq -r '.coverage.minimum_percent // ""' "$report_file")"
          else
            report='{"tests":{"status":"unavailable"},"coverage":{"total_percent":null,"minimum_percent":null,"threshold_met":false,"packages":[],"low_coverage_functions":[]}}'
            total=""
            minimum=""
          fi
          {
            echo "report=$report"
            echo "total=$total"
            echo "minimum=$minimum"
          } >> "$GITHUB_OUTPUT"
      - name: Require unit tests and coverage to pass
        if: always()
        env:
          COVERAGE_RESULT: ${{ steps.coverage.outcome }}
        run: test "$COVERAGE_RESULT" = success

  race:
    name: Race tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: make test-race

  fuzz-seeds:
    name: Fuzz seed corpus
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: make fuzz-seeds

  integration:
    name: Container integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - run: make test-integration

  benchmark:
    name: Benchmarks
    outputs:
      report: ${{ steps.report.outputs.report }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Run PR and base benchmarks
        id: compare
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_EVENT: ${{ github.event_name }}
          MAKEFLAGS: --silent
        run: |
          pr_log="$RUNNER_TEMP/go-benchmarks.log"
          base_log="$RUNNER_TEMP/go-benchmarks-base.log"
          report_file="$RUNNER_TEMP/benchmark-report.json"
          result=0
          make benchmarks > "$pr_log" 2>&1 || result=$?
          cat "$pr_log"

          comparison=""
          unavailable_reason=""
          comparison_available=false
          if [[ "$PR_EVENT" != pull_request ]]; then
            unavailable_reason="This workflow run has no pull request base commit."
          elif [[ -z "$BASE_SHA" ]]; then
            unavailable_reason="The pull request base commit was not available."
          elif (( result != 0 )); then
            unavailable_reason="PR benchmarks failed, so no base comparison was attempted."
          else
            base_dir="$RUNNER_TEMP/benchmark-base"
            base_result=0
            if git worktree add --detach "$base_dir" "$BASE_SHA"; then
              if (cd "$base_dir" && go mod download > "$RUNNER_TEMP/base-mod-download.log" 2>&1 && make -f "$GITHUB_WORKSPACE/Makefile" benchmarks) > "$base_log" 2>&1; then
                base_result=0
              else
                base_result=$?
              fi
              git worktree remove --force "$base_dir" || true
            else
              base_result=1
            fi

            if (( base_result != 0 )); then
              unavailable_reason="Base benchmarks could not complete; see the benchmark job log."
              cat "$base_log" || true
              cat "$RUNNER_TEMP/base-mod-download.log" || true
            elif env -u GOFLAGS GOBIN="$RUNNER_TEMP/bin" go install golang.org/x/perf/cmd/benchstat@latest; then
              if comparison="$("$RUNNER_TEMP/bin/benchstat" "base=$base_log" "PR=$pr_log")" && [[ -n "$comparison" ]]; then
                comparison_available=true
              else
                unavailable_reason="No matched benchmark results were available for statistical comparison."
              fi
            else
              unavailable_reason="benchstat could not be installed, so no statistical comparison is available."
            fi
          fi

          jq -n \
            --arg status "$(if (( result == 0 )); then echo success; else echo failure; fi)" \
            --arg base_sha "$BASE_SHA" \
            --arg comparison "$comparison" \
            --arg unavailable_reason "$unavailable_reason" \
            --argjson comparison_available "$comparison_available" \
            '{status: $status, base_sha: (if $base_sha == "" then null else $base_sha end), comparison_available: $comparison_available, comparison: (if $comparison == "" then null else $comparison end), unavailable_reason: (if $unavailable_reason == "" then null else $unavailable_reason end)}' \
            > "$report_file"

          exit "$result"
      - name: Export benchmark report
        id: report
        if: always()
        run: |
          report_file="$RUNNER_TEMP/benchmark-report.json"
          if [[ -s "$report_file" ]] && jq -e 'type == "object"' "$report_file" > /dev/null; then
            report="$(jq -c . "$report_file")"
          else
            report='{"status":"unavailable","base_sha":null,"comparison_available":false,"comparison":null,"unavailable_reason":"The benchmark report was not generated."}'
          fi
          echo "report=$report" >> "$GITHUB_OUTPUT"
      - name: Require PR benchmarks to pass
        if: always()
        env:
          BENCHMARK_RESULT: ${{ steps.compare.outcome }}
        run: test "$BENCHMARK_RESULT" = success

  test-overview:
    name: Test Overview
    if: always()
    needs: [unit, race, fuzz-seeds, integration, benchmark]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Write test report
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          RACE_RESULT: ${{ needs.race.result }}
          FUZZ_RESULT: ${{ needs.fuzz-seeds.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          UNIT_COVERAGE: ${{ needs.unit.outputs.coverage }}
          MINIMUM_COVERAGE: ${{ needs.unit.outputs.minimum_coverage }}
        run: |
          coverage="${UNIT_COVERAGE:-not available}"
          if [[ -n "${UNIT_COVERAGE:-}" ]]; then
            coverage="${UNIT_COVERAGE}%"
          fi
          {
            echo '## Test Overview'
            echo
            echo '| Test suite | Result | Coverage |'
            echo '| --- | --- | --- |'
            echo "| Unit tests | $UNIT_RESULT | $coverage (minimum: ${MINIMUM_COVERAGE:-65.0}%) |"
            echo "| Race tests (all packages) | $RACE_RESULT | — |"
            echo "| Fuzz seed corpus | $FUZZ_RESULT | — |"
            echo "| Container integration tests | $INTEGRATION_RESULT | — |"
            echo "| Benchmarks | $BENCHMARK_RESULT | — |"
          } >> "$GITHUB_STEP_SUMMARY"

  quality:
    name: Quality checks
    if: always()
    needs: [test-overview]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Verify module graph
        run: |
          go mod verify
          go mod tidy -diff
      - name: Validate workflows
        run: make workflow-check
      - name: Verify formatting
        run: make format-check
      - name: Vet
        run: go vet ./...

  security:
    name: Security scans
    if: always()
    needs: [quality]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@d35c59abb061a4a6fb18e82ac0862c26744d6ab5 # v5.5.0
        with:
          go-version-file: go.mod
          cache: true
      - run: go mod download
      - name: Scan Go dependencies for known vulnerabilities
        run: go run golang.org/x/vuln/cmd/govulncheck@v1.6.0 ./...
      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: false
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: false
          GITLEAKS_ENABLE_SUMMARY: true

  gate:
    name: Required gate
    if: always()
    needs: [unit, race, fuzz-seeds, integration, benchmark, test-overview, quality, security]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI check to pass
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          RACE_RESULT: ${{ needs.race.result }}
          FUZZ_RESULT: ${{ needs.fuzz-seeds.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          TEST_OVERVIEW_RESULT: ${{ needs.test-overview.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
        run: |
          for result in \
            "$UNIT_RESULT" \
            "$RACE_RESULT" \
            "$FUZZ_RESULT" \
            "$INTEGRATION_RESULT" \
            "$BENCHMARK_RESULT" \
            "$TEST_OVERVIEW_RESULT" \
            "$QUALITY_RESULT" \
            "$SECURITY_RESULT"; do
            if [[ "$result" != success ]]; then
              echo "::error::A required go-common job did not pass (result=$result)."
              exit 1
            fi
          done

  pr-check-summary:
    name: Prepare PR check summary
    if: ${{ always() && github.event_name == 'pull_request' }}
    continue-on-error: true
    needs: [unit, race, fuzz-seeds, integration, benchmark, test-overview, quality, security, gate]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Build CI report
        env:
          UNIT_RESULT: ${{ needs.unit.result }}
          RACE_RESULT: ${{ needs.race.result }}
          FUZZ_RESULT: ${{ needs.fuzz-seeds.result }}
          INTEGRATION_RESULT: ${{ needs.integration.result }}
          BENCHMARK_RESULT: ${{ needs.benchmark.result }}
          OVERVIEW_RESULT: ${{ needs.test-overview.result }}
          QUALITY_RESULT: ${{ needs.quality.result }}
          SECURITY_RESULT: ${{ needs.security.result }}
          GATE_RESULT: ${{ needs.gate.result }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          UNIT_REPORT: ${{ needs.unit.outputs.report }}
          BENCHMARK_REPORT: ${{ needs.benchmark.outputs.report }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          jq -n \
            --arg unit "$UNIT_RESULT" \
            --arg race "$RACE_RESULT" \
            --arg fuzz "$FUZZ_RESULT" \
            --arg integration "$INTEGRATION_RESULT" \
            --arg benchmark "$BENCHMARK_RESULT" \
            --arg overview "$OVERVIEW_RESULT" \
            --arg quality "$QUALITY_RESULT" \
            --arg security "$SECURITY_RESULT" \
            --arg gate "$GATE_RESULT" \
            --arg head_sha "$HEAD_SHA" \
            --argjson unit_report "${UNIT_REPORT:-null}" \
            --argjson benchmark_report "${BENCHMARK_REPORT:-null}" \
            --arg run_url "$RUN_URL" \
            '{head_sha: $head_sha, checks: {unit: $unit, race: $race, fuzz_seeds: $fuzz, integration: $integration, benchmarks: $benchmark, test_overview: $overview, quality: $quality, security: $security, required_gate: $gate}, tests: $unit_report.tests, coverage: $unit_report.coverage, benchmark: $benchmark_report, workflow_run: $run_url}' \
            > "$RUNNER_TEMP/pr-check-summary.json"

      - name: Upload PR check summary
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pr-check-summary
          path: ${{ runner.temp }}/pr-check-summary.json
          if-no-files-found: error
          retention-days: 1
