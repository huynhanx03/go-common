name: release-preview

on:
  pull_request:
    branches: [release]
    types: [opened, reopened, synchronize]

permissions:
  contents: read

concurrency:
  group: release-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  preview:
    name: Release notes preview
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: .github/release/package-lock.json
      - name: Install pinned release tooling
        run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: .github/release
      - name: Test release notes preview
        run: node --test .github/release/release-preview.test.mjs
      - name: Generate release notes preview
        env:
          RELEASE_PREVIEW_OUTPUT: ${{ runner.temp }}/release-preview.json
        run: node .github/release/release-preview.mjs
      - name: Add or update PR comment
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPOSITORY: ${{ github.repository }}
          PREVIEW_FILE: ${{ runner.temp }}/release-preview.json
        run: |
          set -euo pipefail
          comment_file="$RUNNER_TEMP/release-preview-comment.md"
          {
            printf '%s\n' '<!-- go-common-release-preview -->' '## Release notes preview' ''
            if jq -e '. == null' "$PREVIEW_FILE" > /dev/null; then
              printf '%s\n' 'No release is expected from the current PR commits.'
            else
              version="$(jq -r '.version' "$PREVIEW_FILE")"
              printf '%s\n\n' "Expected version: \`$version\`"
              jq -r '.notes' "$PREVIEW_FILE"
            fi
          } > "$comment_file"

          comments_endpoint="repos/$REPOSITORY/issues/$PR_NUMBER/comments"
          comment_id="$(gh api --paginate "$comments_endpoint" --jq '.[] | select(.user.login == "github-actions[bot]" and (.body | contains("<!-- go-common-release-preview -->"))) | .id' | sed -n '1p')"
          if [[ -n "$comment_id" ]]; then
            gh api --method PATCH "repos/$REPOSITORY/issues/comments/$comment_id" -f body="$(cat "$comment_file")" > /dev/null
          else
            gh api --method POST "$comments_endpoint" -f body="$(cat "$comment_file")" > /dev/null
          fi
