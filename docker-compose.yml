services:
  postgres:
    extends:
      file: ./docker/postgres.yml
      service: postgres
    ports:
      - "5432:5432"

  mysql:
    extends:
      file: ./docker/mysql.yml
      service: mysql
    ports:
      - "3306:3306"

  mongodb:
    extends:
      file: ./docker/mongodb.yml
      service: mongodb
    ports:
      - "27017:27017"

  redis:
    extends:
      file: ./docker/redis.yml
      service: redis
    ports:
      - "6379:6379"

  elasticsearch:
    extends:
      file: ./docker/elasticsearch.yml
      service: elasticsearch
    ports:
      - "9200:9200"

  kibana:
    extends:
      file: ./docker/kibana.yml
      service: kibana
    ports:
      - "5601:5601"

  kafka:
    extends:
      file: ./docker/kafka.yml
      service: kafka
    ports:
      - "${KAFKA_EXTERNAL_PORT:-29092}:29092"

  kafka-ui:
    extends:
      file: ./docker/kafka-ui.yml
      service: kafka-ui
    ports:
      - "8080:8080"

  debezium:
    extends:
      file: ./docker/debezium.yml
      service: debezium
    ports:
      - "8083:8083"
